<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}" class="nav-brand">
        <span class="brand-bracket">&lt;</span>Philip Todd<span class="brand-bracket"> /&gt;</span>
      </a>
      <nav class="nav-menu">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/projects/' | relative_url }}">Reference Projects</a>
        <a href="{{ '/resume/' | relative_url }}">Resume</a>
        <a href="https://github.com/philiptodd" target="_blank" class="nav-gh">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div>
        <strong>Philip Todd</strong> • Principal / Lead Software Engineer & Solutions Architect
      </div>
      <div class="footer-links">
        <a href="https://github.com/philiptodd" target="_blank">GitHub</a>
        <a href="https://linkedin.com/in/philiptodd" target="_blank">LinkedIn</a>
        <a href="mailto:philip.todd@gmail.com">philip.todd@gmail.com</a>
      </div>
    </div>
  </footer>

  <script>
    function showTab(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
